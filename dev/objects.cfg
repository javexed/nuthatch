# A host and two services that are never checked: their states are what
# is submitted for them (PROCESS_HOST_CHECK_RESULT and the like), at once
# hard. The tests of history and availability script them.
define host {
    use             demo-host
    host_name       passive1
    alias           PASSIVE1
    address         192.0.2.60
    check_command   demo!host!30!0
    max_check_attempts 1
    active_checks_enabled 0
    passive_checks_enabled 1
    check_freshness 0
}
define service {
    use             demo-service
    host_name       passive1
    service_description a
    check_command   demo!a!30!0
    max_check_attempts 1
    active_checks_enabled 0
    passive_checks_enabled 1
    check_freshness 0
}
define service {
    use             demo-service
    host_name       passive1
    service_description b
    check_command   demo!b!30!0
    max_check_attempts 1
    active_checks_enabled 0
    passive_checks_enabled 1
    check_freshness 0
}
define hostgroup {
    hostgroup_name  passive
    alias           Passive
    members         passive1
}
