# A demo site for trying the UI: invented hosts on documentation
# addresses, whose states follow the clock (plugins/demo).
define command {
    command_name    demo
    command_line    $USER1$/demo $HOSTNAME$-$ARG1$ $ARG2$ $ARG3$
}
define command {
    command_name    notify
    command_line    /bin/true
}
define timeperiod {
    timeperiod_name 24x7
    alias           Always
    sunday 00:00-24:00
    monday 00:00-24:00
    tuesday 00:00-24:00
    wednesday 00:00-24:00
    thursday 00:00-24:00
    friday 00:00-24:00
    saturday 00:00-24:00
}
define contact {
    contact_name    admin
    alias           Admin
    email           admin@example.test
    host_notification_period 24x7
    service_notification_period 24x7
    host_notification_commands notify
    service_notification_commands notify
}
# ops: a contact of web1 and web2 (so of their services too) and of the
# service db1/postgres alone. viewer: in admins, made read-only by a role.
# nobody: a contact of nothing.
define contact {
    contact_name    ops
    alias           Ops
    email           ops@example.test
    host_notification_period 24x7
    service_notification_period 24x7
    host_notification_commands notify
    service_notification_commands notify
}
define contact {
    contact_name    viewer
    alias           Viewer
    host_notification_period 24x7
    service_notification_period 24x7
    host_notification_commands notify
    service_notification_commands notify
}
define contact {
    contact_name    nobody
    alias           Nobody
    host_notification_period 24x7
    service_notification_period 24x7
    host_notification_commands notify
    service_notification_commands notify
    can_submit_commands 0
}
define contactgroup {
    contactgroup_name admins
    alias           Admins
    members         admin,viewer
}
define host {
    name            demo-host
    max_check_attempts 2
    check_interval  1
    retry_interval  1
    check_period    24x7
    notification_period 24x7
    notification_interval 30
    contact_groups  admins
    register        0
}
define service {
    name            demo-service
    max_check_attempts 2
    check_interval  1
    retry_interval  1
    check_period    24x7
    notification_period 24x7
    notification_interval 30
    contact_groups  admins
    register        0
}

