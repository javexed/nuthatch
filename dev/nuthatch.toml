# nuthatch against the demo site on both engines. Start them with
# `dev/up naemon` and `dev/up checkd`, make the users with `dev/users`,
# then, from the repo's top: pnpm start dev/nuthatch.toml
listen = "127.0.0.1:8080"
# The phone app, on Android and on iOS.
app_origins = ["https://localhost", "capacitor://localhost"]
web_root = "web/dist"
store = "dev/run/nuthatch.sqlite"
htpasswd = "dev/run/htpasswd"

# admin may do everything. Everyone in the contact group admins sees all
# hosts and services; viewer, who is in it, may change nothing.
# Notifications pushed to browsers (docs/notifications.md).
[notifications]
subject = "mailto:ops@example.test"

# A short history of performance data, for graphs (docs/graphs.md).
[graphs]
days = 2

[roles]
authorized_contactgroup_for_all_hosts = ["admins"]
authorized_for_all_host_commands = ["admin"]
authorized_for_system_commands = ["admin"]
authorized_for_system_information = ["admin"]
authorized_for_configuration_information = ["admin"]
authorized_for_config_edit = ["admin"]
authorized_for_read_only = ["viewer"]

[[backend]]
name = "naemon"
livestatus = "unix:dev/run/naemon/live"

# Naemon runs in a container: its verifier is run there, and the paths it
# knows are mapped to where they are here.
[backend.config]
dir = "dev/run/naemon/managed"
main = "dev/run/naemon/naemon.cfg"
verify = ["docker", "exec", "nuthatch-dev-naemon", "naemon", "-v", "{main}"]
paths = { "/run-site" = "dev/run/naemon", "/site" = "dev" }

[[backend]]
name = "checkd"
livestatus = "unix:dev/run/checkd/live"
# Where jobs reach its HTTP API, to push results (dev/up starts it there).
push_url = "http://127.0.0.1:6560"

[backend.config]
dir = "dev/run/checkd/managed"
main = "dev/run/checkd/naemon.cfg"
verify = ["../checkd/target/debug/checkd", "verify", "--quiet", "{main}"]
