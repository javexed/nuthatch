# The leak gate, where no local switch passes it by: secrets and private
# addresses in the whole tree, and in what a push or pull request adds
# also, on runs that may read the secret LEAK_PATTERNS, the maintainer's
# private list of names. A fork's pull request cannot read secrets, and
# gets the general checks, which is right: nobody leaks names they do not
# know. See scripts/leak-scan.sh.
name: leak gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  leak-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The gate's own test (a guard only ever seen to pass is no guard)
        run: bash scripts/leak-scan.sh --selftest
      - name: The range this adds to main
        id: r
        run: |
          # A push to main: what the push added, from where main was.
          # A pull request: what its branch adds to main.
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = push ] && [ -n "$before" ] && [ "$before" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "range=${before}..HEAD" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify -q origin/main >/dev/null; then
            mb=$(git merge-base origin/main HEAD 2>/dev/null || true)
            [ -n "$mb" ] && [ "$mb" != "$(git rev-parse HEAD)" ] && echo "range=${mb}..HEAD" >> "$GITHUB_OUTPUT" || echo "range=" >> "$GITHUB_OUTPUT"
          else
            echo "range=" >> "$GITHUB_OUTPUT"
          fi
      - name: The commits this adds (added lines and messages)
        if: steps.r.outputs.range != ''
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          LEAK_REQUIRE_OPERATOR_TIER: ${{ github.event.pull_request.head.repo.fork && '0' || (secrets.LEAK_PATTERNS != '' && '1' || '0') }}
        run: bash scripts/leak-scan.sh --range "${{ steps.r.outputs.range }}"
      - name: The whole tree
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: bash scripts/leak-scan.sh --tree .
