[package]
name = "nuthatch"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
futures-util = "0.3.34"
hex = "0.4.3"
md-5 = "0.11.0"
pwhash = "1.0.0"
rand = "0.10.3"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["fs"] }
