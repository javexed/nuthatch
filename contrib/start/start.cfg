# A first config for checkd: this machine, with checks that need no plugin.
# Written to ~/.config/checkd/objects by contrib/quick-start.
define timeperiod {
    timeperiod_name  24x7
    alias            Always
    sunday 00:00-24:00
    monday 00:00-24:00
    tuesday 00:00-24:00
    wednesday 00:00-24:00
    thursday 00:00-24:00
    friday 00:00-24:00
    saturday 00:00-24:00
}
define command {
    command_name  notify-none
    command_line  /bin/true
}
define contact {
    contact_name                   admin
    alias                          Admin
    host_notification_period       24x7
    service_notification_period    24x7
    host_notification_commands     notify-none
    service_notification_commands  notify-none
}
define command {
    command_name  ping
    command_line  checkd:ping -H $HOSTADDRESS$
}
define command {
    command_name  disk
    command_line  checkd:disk -p $ARG1$ -w 80 -c 90
}
define command {
    command_name  memory
    command_line  checkd:memory -w 80 -c 90
}
define command {
    command_name  load
    command_line  checkd:load -w 4 -c 8
}
define host {
    name                   machine
    register               0
    check_command          ping
    max_check_attempts     3
    check_interval         5
    retry_interval         1
    check_period           24x7
    contacts               admin
    notification_period    24x7
}
define service {
    name                   check
    register               0
    max_check_attempts     3
    check_interval         5
    retry_interval         1
    check_period           24x7
    contacts               admin
    notification_period    24x7
}
define host {
    use                    machine
    host_name              localhost
    address                127.0.0.1
}
define service {
    use                    check
    host_name              localhost
    service_description    Disk /
    check_command          disk!/
}
define service {
    use                    check
    host_name              localhost
    service_description    Memory
    check_command          memory
}
define service {
    use                    check
    host_name              localhost
    service_description    Load
    check_command          load
}
